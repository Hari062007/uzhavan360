name: uzhavan360
description: "UZHAVAN360 - Rural empowerment mobile application for Tamil Nadu communities."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  flutter_tts: ^4.2.0
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
